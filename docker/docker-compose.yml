# docker-compose for platelet-seg
# Usage examples:
#  Build and start (GPU):
#    docker compose -f docker/docker-compose.yml up --build
#  Build and start (CPU-only):
#    # Edit docker/Dockerfile to use python:3.10-slim as base, then:
#    docker compose -f docker/docker-compose.yml up --build
#
# Environment example (override in .env or in your shell):
#   USE_GPU=1
#   DEVICE=cuda:0

version: '3.8'
services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "5000:5000"
    # Bind-mount the code for live edits during development.
    # On Linux the path '../' (relative to the docker/ directory) maps to project root.
    volumes:
      - ../:/app:rw
    environment:
      - USE_GPU=${USE_GPU:-1}
      - DEVICE=${DEVICE:-cuda:0}
    # Use NVIDIA runtime when running on a GPU host. If your Docker runtime is configured
    # with the nvidia-container-toolkit, this instructs the engine to expose the GPUs.
    runtime: nvidia
    # Optional: add device reservation (note: only works for swarm deployments with deploy)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

# CPU fallback notes:
# - If you do not have a GPU, change the Dockerfile base to `python:3.10-slim` (see Dockerfile comment)
# - Remove the `runtime: nvidia` line, and you can optionally remove the deploy.resources block.

# Build and run commands:
#   docker compose -f docker/docker-compose.yml build
#   docker compose -f docker/docker-compose.yml up
# To run in detached mode:
#   docker compose -f docker/docker-compose.yml up -d

# Troubleshooting:
# - Ensure `docker` and `docker-compose` (or the Compose V2 plugin) are installed.
# - On GPU hosts, ensure the NVIDIA Container Toolkit is installed and configured:
#     https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
